
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  activity-service:
    build: ./services/activity
    volumes:
      - ./services/activity:/app
      - ./services/activity/data:/app/data

  bid-service:
    build: ./services/bid
    volumes:
      - ./services/bid:/app
      - ./services/bid/data:/app/data

  listing-service:
    build: ./services/listing
    volumes:
      - ./services/listing:/app
      - ./services/listing/data:/app/data

  auth-service:
    build: ./services/auth
    env_file:
      - .env
    volumes:
      - ./services/auth:/app
      - ./services/auth/data:/app/data

  api-gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway:/app
    env_file:
      - .env
    depends_on:
      - auth-service
      - activity-service
      - bid-service
      - listing-service
